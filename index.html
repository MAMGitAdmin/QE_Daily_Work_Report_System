      ($('login-name') || {}).value?.trim() || '';

    const password =
      ($('login-password') || {}).value || '';

    S.loginName = user_id;
    S.loginNameError = '';
    S.loginPasswordError = '';
    S.loginMessage = '';

    if (!user_id) {
      S.loginNameError =
        'Please enter your Staff ID.';
    }

    if (!password) {
      S.loginPasswordError =
        'Please enter your password.';
    }

    if (
      S.loginNameError ||
      S.loginPasswordError
    ) {
      render();
      return;
    }

    try {
      const data = await api(
        'POST',
        '/api/auth/staff',
        {
          user_id,
          password
        }
      );

      S.token = data.token;
      S.user = data.staff;
      S.role = 'staff';
      S.view = 'staff';

      await loadAll();

      sessionStorage.setItem(
        'wps_session',
        JSON.stringify({
          user: S.user,
          role: 'staff',
          token: S.token
        })
      );

      render();

    } catch (error) {
      S.loginNameError = '';
      S.loginPasswordError = '';
      if (error.code === 'STAFF_ID_NOT_FOUND') {
        S.loginNameError = error.message;
      } else if (
        error.code ===
        'PASSWORD_SETUP_REQUIRED'
      ) {
        S.loginPasswordError  =
          'Please create your password first.';
      }  else if (
    error.code === 'INCORRECT_PASSWORD'
  ) {
    S.loginPasswordError =
      'Incorrect password.';
  } else {
        S.loginPasswordError = error.message;
      }

      render();

      setTimeout(() => {
        const input =
        error.code === 'STAFF_ID_NOT_FOUND'
        ? $('login-name')
        : $('login-password');

        if (input) {
          input.focus();
        }
      }, 50);
    }
  };

  btnStaff.onclick = loginStaff;

  const staffIdInput = $('login-name');
  const staffPasswordInput =
    $('login-password');

  if (staffIdInput) {
    staffIdInput.onkeydown = event => {
      if (event.key === 'Enter') {
        if (staffPasswordInput) {
          staffPasswordInput.focus();
        } else {
          loginStaff();
        }
      }
    };
  }

  if (staffPasswordInput) {
    staffPasswordInput.onkeydown = event => {
      if (event.key === 'Enter') {
        loginStaff();
      }
    };
  }
}

 // Superuser PIN visibility

const saveEmailSettings = $('btn-save-email-settings');

const refreshEmailLogs = $('btn-refresh-email-logs');

if (refreshEmailLogs) {
  refreshEmailLogs.onclick = async () => {
    refreshEmailLogs.disabled = true;

    try {
      const response = await api(
        'GET',
        '/api/admin/email-logs?limit=100'
      );

      S.emailLogs = response.logs || [];
      render();

    } catch (error) {
      refreshEmailLogs.disabled = false;
      toast(error.message, true);
    }
  };
}

  // Logout
  const lo=$('btn-logout');
  if(lo) lo.onclick=()=>{
    sessionStorage.removeItem('wps_session');
    Object.assign(S,{view:'login',role:null,user:null,selectedRole:null,loginError:'',loginNameError:'',loginPinError:'',loginPasswordError: '',loginMessage: '',staffPasswordSetup: false,staffSetupError: '',showPin:false,loginSuperuserPinError: '',showSuperuserPin: false,detailId:null,search:'',filterStatus:'',showNewProg:false,showNewReport:false,editingReportId:null,editProgMode:false,statusEditMode:false,confirm:null, sidebarOpen: false});
    render();
  };

  // Nav
document.querySelectorAll('[data-nav]').forEach(b => {
  b.onclick = () => {
    const nav = b.getAttribute('data-nav');
    if (nav === 'programmes') {
      S.navView = 'programmes';
      S.detailId = null;
      S.showNewProg = false;
      S.showNewReport = false;
      S.editProgMode = false;
      S.statusEditMode = false;
      
      // Reset dashboard drill-down
      S.dashboardDrillDown = false;
      S.dashboardSelectedProgramme = null;
      render();
    } else if (nav === 'dashboard') {
      S.navView = 'dashboard';
      S.detailId = null;
      S.showNewProg = false;
      S.showNewReport = false;
      S.editProgMode = false;
      S.statusEditMode = false;
      render();
    }
  };
});
  // Back
  const back=$('btn-back');
  if(back) back.onclick=()=>{S.detailId=null;S.showNewProg=false;S.showNewReport=false;S.editProgMode=false;S.statusEditMode=false;render();};

  // Search & filter
  const sb=$('search-box'),sf=$('status-filter');
  if(sb){
    let searchTimeout;
    sb.oninput = function(e) {
      S.search = e.target.value;

      if (searchTimeout) clearTimeout(searchTimeout);

      const start = this.selectionStart;
      const end = this.selectionEnd;
      const value = this.value;

      searchTimeout = setTimeout(()=> {
        render();

      const newInput = document.getElementById('search-box');
      if (newInput && document.activeElement !==newInput){
        newInput.focus();
        newInput.setSelectionRange(start,end);
      }
      }, 300)
    };

    sb.onkeydown = function(e){
      if(e.key === 'Enter'){
        if(searchTimeout) clearTimeout(searchTimeout);
        const start = this.selectionStart;
        const end = this.selectionEnd;
        render();
        const newInput = document.getElementById('search-box');
        if (newInput){
          newInput.focus();
          newInput.setSelectionRange(start,end);
        }
      }
    };
  }

  if(sf) sf.onchange= e=>{S.filterStatus=e.target.value; render();};
  


  // Programme card click
  document.querySelectorAll('.programme-card[data-prog-id]').forEach(c=>c.onclick=()=>{
    S.detailId=c.getAttribute('data-prog-id');
    S.showNewReport=false;S.editingReportId=null;S.editProgMode=false;S.statusEditMode=false;
    S.newReport={date:today(),hours:'',status:'in-progress',priority:'middle',summary:'',involvedStaff:[],files:[]};
    render();
  });

  // Export
  const expCSV=$('btn-export-csv'), expPrint=$('btn-export-print');
  if(expCSV)   expCSV.onclick=exportCSV;
  if(expPrint) expPrint.onclick=exportPrint;

  // Delete programme
  const delProg=$('btn-delete-prog');
  if(delProg) delProg.onclick=()=>{
    const deletedProgrammeId = S.detailId;
    const programme = S.programmes.find(
      item => item.id === deletedProgrammeId
    );
      confirm(
      'Delete Highlight',
      `Delete "${programme?.title}"? This will remove all its daily reports too. This cannot be undone.`,    async()=>{
      try{
        await api('DELETE',`/api/programmes/${S.detailId}`,{requestedBy:S.user?.name||S.user?.id|| 'Unknown'});
        S.programmes = S.programmes.filter(
            item => item.id !== deletedProgrammeId
          );
        if (S.role === 'superuser') {
            S.emailLogs = (S.emailLogs || []).filter(
              log => log.programmeId !== deletedProgrammeId
            );
          }

        S.detailId = null;
        toast('Highlight and related email logs deleted.');
        render();
      }catch(e){toast(e.message,true);}
    });
  };

  // New programme
  const showNP=$('btn-show-new-prog');
  if(showNP) showNP.onclick=()=>{S.showNewProg=true;S.newProg={title:'',assignedStaff:[],status:'in-progress'};S.staffQ.prog='';render();};
  const cancelNP=$('btn-cancel-new-prog');
  if(cancelNP) cancelNP.onclick=()=>{S.showNewProg=false;render();};
  const npTitle=$('np-title'),npStatus=$('np-status');
  if(npTitle) npTitle.oninput=e=>S.newProg.title=e.target.value;
  if(npStatus) npStatus.onchange=e=>S.newProg.status=e.target.value;
  const npSearch=$('np-staff-search');
  if(npSearch){
    npSearch.oninput=e=>{ S.staffQ.prog=e.target.value; S.showProgStaffDD=true; updateStaffDropdown('np-staff-search','prog'); };
    npSearch.onfocus=()=>{ S.showProgStaffDD=true; updateStaffDropdown('np-staff-search','prog'); };
  }
  const createProg=$('btn-create-prog');
  if(createProg) createProg.onclick=async()=>{
    const title=($('np-title')||{}).value?.trim()||S.newProg.title.trim();
    if(!title){toast('Please enter a programme title.',true);return;}
    try{
      const prog=await api('POST','/api/programmes',{title,createdBy:S.user.id,assignedStaff:[S.user.id,...S.newProg.assignedStaff],status:S.newProg.status});
      S.programmes.unshift(prog);S.showNewProg=false;S.newProg={title:'',assignedStaff:[],status:'in-progress'};
      toast('Highlight created!');render();
    }catch(e){toast(e.message,true);}
  };

  // Edit programme
  const editProg=$('btn-edit-prog');
  if(editProg) editProg.onclick=()=>{
    const p=S.programmes.find(x=>x.id===S.detailId);
    if(!p)return;
    S.editProgMode=true;
    S.editProgDraft={title:p.title,assignedStaff:[...(p.assignedStaff||[])],status:p.status};
    S.staffQ.editProg='';render();
  };
  const cancelProgEdit=$('btn-cancel-prog-edit');
  if(cancelProgEdit) cancelProgEdit.onclick=()=>{S.editProgMode=false;render();};
  const saveProgEdit=$('btn-save-prog-edit');
  if(saveProgEdit) saveProgEdit.onclick=async()=>{
    const title=($('edit-prog-title')||{}).value?.trim()||S.editProgDraft.title.trim();
    if(!title){toast('Title required.',true);return;}
    try{
      const status=($('edit-prog-status')||{}).value||S.editProgDraft.status;
      const up=await api('PUT',`/api/programmes/${S.detailId}`,{title,assignedStaff:S.editProgDraft.assignedStaff,status,updatedBy:S.user?.name||'manager',updateType:'details'});
      const idx=S.programmes.findIndex(p=>p.id===S.detailId);if(idx!==-1)S.programmes[idx]=up;
      S.editProgMode=false;toast('Highlight updated!');render();
    }catch(e){toast(e.message,true);}
  };
  const epTitleInput=$('edit-prog-title');
  if(epTitleInput) epTitleInput.oninput=e=>S.editProgDraft.title=e.target.value;
  const epStatus=$('edit-prog-status');
  if(epStatus) epStatus.onchange=e=>S.editProgDraft.status=e.target.value;
  const epSearch=$('edit-prog-staff-search');
  if(epSearch){
    epSearch.oninput=e=>{ S.staffQ.editProg=e.target.value; S.showEditProgStaffDD=true; updateStaffDropdown('edit-prog-staff-search','editprog'); };
    epSearch.onfocus=()=>{ S.showEditProgStaffDD=true; updateStaffDropdown('edit-prog-staff-search','editprog'); };
  }


  const seEdit = $('btn-status-edit');
  const seCancel = $('btn-status-cancel');
  const seSave = $('btn-status-save');
  // Status edit
  
  if(seEdit)   seEdit.onclick=()=>{S.statusEditMode=true;render();};
  if(seCancel) seCancel.onclick=()=>{S.statusEditMode=false;render();};
  if(seSave)   seSave.onclick=async()=>{
    const sel=$('prog-status-sel');if(!sel)return;
    try{
      const up=await api('PUT',`/api/programmes/${S.detailId}`,{status:sel.value,updatedBy:S.user?.name||'manager',updateType:'status'});
      const idx=S.programmes.findIndex(p=>p.id===S.detailId);if(idx!==-1)S.programmes[idx]=up;
      S.statusEditMode=false;toast('Status updated!');render();
    }catch(e){toast(e.message,true);}
  };

  // Toggle add report section
  const toggleR=$('btn-toggle-report');
  if(toggleR) toggleR.onclick=()=>{
    if(S.showNewReport){S.showNewReport=false;S.editingReportId=null;}
    else{S.showNewReport=true;S.editingReportId=null;S.newReport={date:today(),hours:'',status:'in-progress',priority:'middle',summary:'',involvedStaff:[],files:[]};}
    render();
  };
  const cancelR=$('btn-cancel-report');
  if(cancelR) cancelR.onclick=()=>{S.showNewReport=false;S.editingReportId=null;render();};

  const nrSearch=$('nr-staff-search');
  if(nrSearch){
    nrSearch.oninput=e=>{ S.staffQ.report=e.target.value; S.showReportStaffDD=true; updateStaffDropdown('nr-staff-search','report'); };
    nrSearch.onfocus=()=>{ S.showReportStaffDD=true; updateStaffDropdown('nr-staff-search','report'); };
  }

  // File upload
  const zone=$('upload-zone'),fi=$('file-input');
  if(zone&&fi){
    zone.onclick=()=>fi.click();
    fi.onchange=async e=>{
      const files=[...e.target.files];
      if (!files.length) return;
      for (const f of files) {
        const form = new FormData();
        form.append('file', f);
        try {
          const res = await fetch(API + '/api/upload', { method:'POST', body: form, headers:{'X-Auth-Token': S.token||''} });
          const data = await res.json().catch(()=>({}));
          if (!res.ok) throw new Error(data.error || 'Upload failed');
          S.newReport.files.push({ name: data.name || f.name, size: f.size, type: f.type, path: data.path });
        } catch (err) {
          toast(err.message || 'Upload failed', true);
        }
      }
      fi.value='';
      render();
    };
  }
  document.querySelectorAll('.fi-rm').forEach(b=>b.onclick=e=>{e.stopPropagation();S.newReport.files.splice(+b.getAttribute('data-idx'),1);render();});

  // Edit report
  document.querySelectorAll('.btn-edit-report').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const rid=b.getAttribute('data-report-id');
    const prog=S.programmes.find(p=>p.id===S.detailId);
    const rep=(prog?.dailyReports||[]).find(r=>r.id===rid);
    if(!rep)return;
    const isOwn = rep.staff === S.user?.id;
    S.editingReportId=rid;S.showNewReport=true;
    S.newReport={date:rep.date,hours:rep.hours||'',status:rep.status,priority:rep.priority||'middle',summary:rep.summary,involvedStaff:[...(rep.involvedStaff||[])],files:[...(rep.files||[])],editReason:'',_isOwn:isOwn};
    window.scrollTo({top:0,behavior:'smooth'});render();
  });

  // Delete report
  document.querySelectorAll('.btn-delete-report').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const rid=b.getAttribute('data-report-id');
    const pid=b.getAttribute('data-prog-id');
    const prog=S.programmes.find(p=>p.id===pid);
    const rep=(prog?.dailyReports||[]).find(r=>r.id===rid);
    if(!rep)return;
    confirm('Delete Report',`Delete the report by ${rep.staff} on ${rep.date}? This cannot be undone.`,async()=>{
      try{
        await api('DELETE',`/api/programmes/${pid}/reports/${rid}`,{requestedBy:S.user?.name||'manager'});
        const idx=S.programmes.findIndex(p=>p.id===pid);
        if(idx!==-1) S.programmes[idx].dailyReports=(S.programmes[idx].dailyReports||[]).filter(r=>r.id!==rid);
        toast('Report deleted.');render();
      }catch(e){toast(e.message,true);}
    });
  });

  // Submit report
  const subR=$('btn-submit-report');
  if(subR) subR.onclick=async()=>{
    const summary=($('nr-summary')||{}).value?.trim()||'';
    if(!summary){toast('Please write a work summary.',true);return;}
    const isOwn = S.newReport._isOwn !== false;
    const editReason = ($('nr-edit-reason')||{}).value?.trim()||'';
    if(S.editingReportId && !isOwn && !editReason){
      toast('Please provide a reason for editing this report.',true); return;
    }
    const payload={
      date:($('nr-date')||{}).value||today(),
      hours:($('nr-hours')||{}).value||'',
      status:($('nr-status')||{}).value||'in-progress',
      priority:($('nr-priority')||{}).value||'middle',
      summary,
      involvedStaff:S.newReport.involvedStaff,
      files:S.newReport.files,
      editReason: S.editingReportId && !isOwn ? editReason : '',
      editedBy: S.editingReportId && !isOwn ? S.user.id : '',
    };
    try{
      if(S.editingReportId){
        const res=await api('PUT',`/api/programmes/${S.detailId}/reports/${S.editingReportId}`,{...payload,updatedBy:S.user.id});
        const idx=S.programmes.findIndex(p=>p.id===S.detailId);if(idx!==-1)S.programmes[idx]=res.programme;
        toast('Report updated!');
      }else{
        const res=await api('POST',`/api/programmes/${S.detailId}/reports`,{...payload,staff: S.user.id});
        const idx=S.programmes.findIndex(p=>p.id===S.detailId);if(idx!==-1)S.programmes[idx]=res.programme;
        toast('Report submitted!');
      }
      S.showNewReport=false;S.editingReportId=null;
      S.newReport={date:today(),hours:'',status:'in-progress',priority:'middle',summary:'',involvedStaff:[],files:[]};
      render();
    }catch(e){toast(e.message,true);}
  };

  // Manager notes
  document.querySelectorAll('.btn-save-note').forEach(b=>b.onclick=async()=>{
    const rid=b.getAttribute('data-report-id'),pid=b.getAttribute('data-prog-id');
    const note=($('note-'+rid)||{}).value||'';
    try{
      await api('PUT',`/api/programmes/${pid}/reports/${rid}/note`,{managerNote:note});
      const prog=S.programmes.find(p=>p.id===pid);
      if(prog){const rep=(prog.dailyReports||[]).find(r=>r.id===rid);
        if(rep)rep.managerNote=note;
      }
      S.managerNoteEditingId = null;
      toast('Note saved!');
      render();
    }catch(e){toast(e.message,true);}
  });

  // Staff dropdown item selection
  document.querySelectorAll('.staff-dd-item').forEach(item=>item.onclick=e=>{
    e.stopPropagation();
    const name=item.getAttribute('data-name'),ctx=item.getAttribute('data-ctx');
    if(ctx==='prog')    { if(!S.newProg.assignedStaff.includes(name))S.newProg.assignedStaff.push(name); S.staffQ.prog='';S.showProgStaffDD=false; }
    if(ctx==='report')  { if(!S.newReport.involvedStaff.includes(name))S.newReport.involvedStaff.push(name); S.staffQ.report='';S.showReportStaffDD=false; }
    if(ctx==='editprog'){ if(!S.editProgDraft.assignedStaff.includes(name))S.editProgDraft.assignedStaff.push(name); S.staffQ.editProg='';S.showEditProgStaffDD=false; }
    render();
  });

  // Chip removes
  document.querySelectorAll('.chip-x').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const name=b.getAttribute('data-name'),ctx=b.getAttribute('data-ctx');
    if(ctx==='prog')    S.newProg.assignedStaff=S.newProg.assignedStaff.filter(n=>n!==name);
    if(ctx==='report')  S.newReport.involvedStaff=S.newReport.involvedStaff.filter(n=>n!==name);
    if(ctx==='editprog')S.editProgDraft.assignedStaff=S.editProgDraft.assignedStaff.filter(n=>n!==name);
    render();
  });

}
document.addEventListener('click', e => {
  let changed = false;
  if(S.showProgStaffDD && !e.target.closest('#np-staff-search,.staff-dd-item[data-ctx="prog"]')){ S.showProgStaffDD=false; changed=true; }
  if(S.showReportStaffDD && !e.target.closest('#nr-staff-search,.staff-dd-item[data-ctx="report"]')){ S.showReportStaffDD=false; changed=true; }
  if(S.showEditProgStaffDD && !e.target.closest('#edit-prog-staff-search,.staff-dd-item[data-ctx="editprog"]')){ S.showEditProgStaffDD=false; changed=true; }
  if(changed) render();
});

// ── INIT ───────────────────────────────────────────────────────────────────
async function init() {
  setLoading();
  const saved = sessionStorage.getItem('wps_session');
  if (saved) {
    try {
      const { role, token } = JSON.parse(saved);
      S.token = token;
      const session = await api('GET','/api/me');
      if (!session || !session.role) throw new Error('Session expired');
      S.user = session; S.role = session.role; S.view = session.role;

       S.navView = 'programmes';

      if (session.role === 'superuser') {
        await Promise.all([
          loadAll(),
          loadAdminData()
        ]);
      } else {
        await loadAll();
      }
      render();
      return;
    } catch(e) {
      sessionStorage.removeItem('wps_session');
    }
  }
  const lastRole = getLastRole();;

  if (lastRole) {
    S.selectedRole = lastRole;
  }

  applyTheme(theme);
  render();
  // IMPROVEMENT 3: Autofocus the right field if role was pre-selected
  if (lastRole) {
    setTimeout(()=>{
       const focusId = 
        lastRole === 'manager' ? 'login-pin': lastRole==='superuser' ? 'login-superuser-id' : 'login-name';
        
        const el = document.getElementById(focusId);
      if (el) el.focus();
    }, 50);
  }
}
init();
